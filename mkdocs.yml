site_name: OpenVBS++
site_description: A VBScript-flavoured language that compiles to a Python AST and runs on CPython
site_url: https://marfchen.github.io/OpenVBSpp/
repo_url: https://github.com/MarfChen/OpenVBSpp
repo_name: MarfChen/OpenVBSpp
edit_uri: edit/main/doc/
docs_dir: doc
copyright: Apache-2.0 · VBScript is a Microsoft trademark; OpenVBS++ is an independent implementation.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Every page is English by default; each one links to its .zh-CN.md counterpart at the top.
# The Chinese pages also get their own section so they are reachable without the in-page link.
nav:
  - Home: index.md
  - 简体中文: index.zh-CN.md
  - Language reference:
      - VBScript superset: VBS_SUPERSET.md
      - Object model: OBJECT_MODEL.md
      - Object-oriented programming: OOP.md
      - Modern features: MODERN_FEATURES.md
  - Tooling:
      - over package manager: OVER.md
      - Web IDE: WEB_IDE.md
  - Legal and compliance: LEGAL.md
  - 中文文档:
      - VBScript 超集: VBS_SUPERSET.zh-CN.md
      - 对象模型: OBJECT_MODEL.zh-CN.md
      - 面向对象: OOP.zh-CN.md
      - 现代特性: MODERN_FEATURES.zh-CN.md
      - over 包管理器: OVER.zh-CN.md
      - 网页 IDE: WEB_IDE.zh-CN.md
      - 法务与合规: LEGAL.zh-CN.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MarfChen/OpenVBSpp

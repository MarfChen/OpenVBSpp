name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Linux 目前标记为实验性：本地只在 Windows 上验证过，先收集数据，
    # 稳定后把 experimental 删掉即可变成门禁。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=75" wheel build

      # com-support 在 Windows 上才有意义；装上 pywin32 才能覆盖
      # 「COM 可用」这条分支，其它平台跳过。
      - name: Install pywin32 (Windows only)
        if: runner.os == 'Windows'
        run: python -m pip install "pywin32>=306"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke test the wheel
        shell: bash
        run: |
          set -e
          python -m pip install --force-reinstall dist/*.whl
          python -c "import OpenVBSPP, sys; print('OpenVBSPP', OpenVBSPP.__version__, sys.version)"
          printf 'Option Explicit\nDim i, s\ns = 0\nFor i = 1 To 10\n  s = s + i\nNext\necho s\n' > smoke.vbs
          python -m OpenVBSPP smoke.vbs

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows and Linux are both hard gates. Linux keeps the cheapest matrix
    # (3.10 and 3.13) so the badge still reflects the supported platforms.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the Linux lane cheap: oldest and newest interpreter only.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Toolchain
        run: python -m pip install --upgrade pip "setuptools>=77" wheel build

      - name: Install (editable, dev extras)
        run: python -m pip install -e ".[dev]" --no-build-isolation

      # pywin32 is optional and Windows-only; installing it exercises the "COM is
      # available" branch of the bridge instead of only the unavailable path.
      - name: Install pywin32 (Windows only)
        if: runner.os == 'Windows'
        run: python -m pip install "pywin32>=306"

      - name: Unit tests with coverage
        run: python -m coverage run --source=OpenVBSPP,cli -m unittest discover -s tests

      - name: Coverage report
        run: |
          python -m coverage report --skip-covered --skip-empty
          python -m coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        if: runner.os == 'Windows' && matrix.python == '3.13' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify entry points
        run: |
          python -m OpenVBSPP --version
          python -c "import OpenVBSPP; print('OpenVBSPP', OpenVBSPP.__version__)"
          python -m OpenVBSPP -c "echo 6 * 7"

      - name: COM smoke test (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          printf 'Set sh = CreateObject("WScript.Shell")\necho sh.ExpandEnvironmentStrings("%%OS%%")\n' > com_smoke.vbs
          python -m OpenVBSPP com_smoke.vbs

      - name: Build sdist and wheel
        run: python -m build

      - name: Wheel smoke test (clean venv)
        shell: bash
        run: |
          set -e
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then
            BIN="$RUNNER_TEMP/smoke/Scripts"
          else
            BIN="$RUNNER_TEMP/smoke/bin"
          fi
          "$BIN/python" -m pip install --upgrade pip >/dev/null
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" -m OpenVBSPP --version
          "$BIN/python" -m OpenVBSPP -c "echo 21 * 2"
          # vendor/com-support must be shipped inside the wheel.
          "$BIN/python" -c "import OpenVBSPP.ovpprt.com as c; print('com-support:', c.resolve())"

      - name: Upload distributions
        if: runner.os == 'Windows' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  exe:
    name: exe / ${{ matrix.runner }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    # The single-file build is slow; run it for tags and manual dispatches only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # `windows-11-arm` is available to public repositories only (GA since
    # 2025-08). If you publish from a private repo, delete that matrix entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Toolchain
        run: python -m pip install --upgrade pip "setuptools>=77" wheel "pyinstaller>=6.0"

      - name: Install package with COM support
        run: python -m pip install -e ".[com]" --no-build-isolation

      - name: Build openvbs.exe
        run: python -m PyInstaller packaging/openvbs.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Smoke test the exe
        shell: pwsh
        run: |
          Copy-Item dist/openvbs.exe "$env:RUNNER_TEMP/openvbs.exe"
          & "$env:RUNNER_TEMP/openvbs.exe" --version
          Set-Content -Path com_smoke.vbs -Encoding utf8 -Value 'Set sh = CreateObject("WScript.Shell")', 'echo sh.ExpandEnvironmentStrings("%OS%")'
          & "$env:RUNNER_TEMP/openvbs.exe" com_smoke.vbs

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: openvbs-exe-${{ matrix.arch }}
          path: dist/openvbs.exe
          if-no-files-found: error
